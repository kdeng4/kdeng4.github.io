title: Helping customers find what they need next
shortTitle: Customer recommendations
category: Data engineering
year: "2025"
period: "2025"
context: Commercial project
role: Data warehouse and recommendation workflow
featured: true
order: 1
summary: >-
  I built a customer data warehouse and recommendation workflow to help marketing
  suggest useful products at the right time. It combined what customers had bought,
  what they were browsing, and when they might need to buy again.
outcome: >-
  Marketing received product lists based on purchase history, browsing activity,
  and estimated repeat purchase timing. Duplicate products were removed and the
  remaining recommendations ranked again before campaign review.
stack: [SQL, PySpark, Batch processing, Recommendation ranking, Repeat purchase analysis, Deduplication]
sections:
  - title: Estimate what a customer may need next
    paragraphs:
      - >-
        I studied repeat purchases at the category level, grouping related
        products for the analysis.
      - >-
        These patterns gave a rough estimate of the time between purchases
        in each category. I compared that estimate with each customer's
        purchase history to find categories they might need again soon.
  - title: Turn that need into useful product choices
    paragraphs:
      - >-
        Recent purchases and the order of browsing activity helped identify
        relevant categories. I combined those signals with estimated repeat
        purchase timing to rank product recommendations.
      - >-
        Ranking ran in two passes. A quick first pass narrowed the candidate
        list. A more detailed second pass ordered the remaining recommendations
        for each customer token. This focused the detailed ranking work on
        a smaller set of candidates.
      - >-
        I checked each customer's recommendation list for repeated products,
        removed the duplicates, and ranked the remaining products again.
  - title: Build the purchase history behind the ranking
    paragraphs:
      - >-
        The ranking relied on a combined view of past purchases. I linked
        purchase records from different payment cards to a customer
        token, so recommendations could draw on that customer's purchase history.
        Recommendations were calculated for each token.
      - >-
        SQL handled the initial data preparation. The workflow also removed
        duplicate transaction records. I used PySpark for model building and
        batch runs, so the heavier calculations could run in parallel across
        the data.
  - title: Make the workflow easy to review
    paragraphs:
      - >-
        During development, I started with rules that captured known business
        logic. This gave the team a clear way to check the first version,
        provide feedback, and refine the logic.
      - >-
        The final product lists went to marketing for review before campaign
        deployment.
  - title: About this case study
    paragraphs:
      - >-
        This case study describes the technical approach. Company names,
        customer data, internal identifiers, and business figures
        are omitted.
