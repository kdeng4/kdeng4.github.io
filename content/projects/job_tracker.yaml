title: Job Application Timeline Tracker
shortTitle: Tracking job applications in one place
category: Software development
year: "2023"
period: September to December 2023
context: Software Development Process (CS 6300), Georgia Tech
role: Android development in a team of three
featured: true
order: 4
summary: >-
  I helped build an Android app in a team of three. It keeps job
  applications in a timeline, lets users edit entries, and saves them
  locally for offline access.
outcome: An Android app with a timeline, editable entries, and offline storage.
stack: [Java, Android, SQLite]
sections:
  - title: The task
    paragraphs:
      - >-
        Job applications come with dates, details, and changing statuses.
        We wanted to make them easier to track and review in one place.
  - title: What we built
    paragraphs:
      - >-
        I worked with two teammates to build an Android app for adding,
        editing, and tracking job applications.
    bullets:
      - A timeline that shows the status of each application.
      - Options to add, edit, and delete applications and their details.
      - A local SQLite database that keeps entries available offline.
  - title: How we worked
    paragraphs:
      - >-
        We took the app from requirements and design through development,
        test planning, and documentation. We used Java with IntelliJ IDEA
        and Android Studio.
links:
