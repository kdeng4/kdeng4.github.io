title: Pathways from an Online Master's to a PhD
shortTitle: From online learning to doctoral research
category: Education research
year: "2026"
period: SIGCSE 2026
context: Georgia Tech · OMSCS
role: Co-author
featured: false
order: 4
summary: >-
  A research study on how Georgia Tech's online master's in computer
  science prepares graduates for STEM doctoral programmes, using
  enrolment data, surveys, and interviews. Presented at SIGCSE 2026.
outcome: A co-authored publication presented at SIGCSE 2026.
stack: [Education research, Surveys, Interviews]
sections:
  - title: The question
    paragraphs:
      - >-
        How does a large online master's programme in computer science
        prepare graduates for STEM PhD programmes? This study considers
        the experiences of alumni who made that transition.
  - title: The study
    paragraphs:
      - >-
        I co-authored this research with Alexander D. Greenhalgh, Brian Yu,
        Nicholas Lytle, and David A. Joyner. The study draws on enrolment
        data, surveys, and interviews to understand graduates' pathways
        into doctoral research.
    bullets:
      - Examined the role of graduate research experience and rigorous coursework in PhD readiness.
      - Considered how affordable, asynchronous programmes support non-traditional students.
      - Developed recommendations for research opportunities for PhD-bound students.
  - title: Publication
    paragraphs:
      - >-
        Exploring Transitions of Graduates From an Online Master's in
        Computer Science Program to Doctoral Programs. Published in the
        proceedings of the 57th ACM Technical Symposium on Computer
        Science Education, 2026.
