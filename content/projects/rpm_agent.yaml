title: Raven's Progressive Matrices Agent
shortTitle: Solving visual puzzles
category: Knowledge based AI
year: "2024"
period: May to August 2024
context: Knowledge Based AI (CS 7637), Georgia Tech
role: AI agent design and development
featured: true
order: 2
summary: >-
  I built an AI agent that finds the missing image in a visual puzzle.
  It models changes between images and tests possible answers, reaching
  80% accuracy on advanced problem sets.
outcome: 80% accuracy on advanced problem sets.
stack: [Python, Semantic networks, Visual reasoning]
sections:
  - title: The task
    paragraphs:
      - >-
        Raven's Progressive Matrices test pattern recognition and reasoning.
        Each puzzle shows a grid of images with one missing. The agent
        must find how the images change and choose the one that completes
        the grid.
  - title: What I built
    paragraphs:
      - >-
        I designed and built an agent for 2×2 and 3×3 grids. It records
        how images relate to each other, then uses those relationships
        to compare possible answers.
    bullets:
      - Used semantic networks, which map relationships, to record changes between images.
      - Tested possible answers against the patterns in the puzzle.
      - Turned parts of human reasoning into steps the agent could follow.
  - title: The result
    paragraphs:
      - >-
        The agent reached 80% accuracy on advanced problem sets. It used
        a model of visual relationships to work through each puzzle.
