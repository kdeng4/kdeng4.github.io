title: Pathways from an Online Master's to a PhD
shortTitle: From an online master's to a PhD
category: Education research
year: "2026"
period: SIGCSE 2026
context: Georgia Tech · OMSCS
role: Research coauthor
featured: false
order: 5
summary: >-
  I coauthored a study of how Georgia Tech's online computer science
  master's degree prepares graduates for a PhD. It uses enrolment data,
  surveys, and interviews, and was presented at SIGCSE 2026.
outcome: A research paper presented at SIGCSE 2026.
stack: [Education research, Surveys, Interviews]
sections:
  - title: The question
    paragraphs:
      - >-
        How does a large online computer science master's programme
        prepare graduates for a PhD in science, technology, engineering,
        or maths? We studied alumni who made that move.
  - title: The study
    paragraphs:
      - >-
        I coauthored this research with Alexander D. Greenhalgh, Brian Yu,
        Nicholas Lytle, and David A. Joyner. The study draws on enrolment
        data, surveys, and interviews to understand how graduates
        move into PhD research.
    bullets:
      - Examined how graduate research experience and demanding coursework prepare students for a PhD.
      - Considered how affordable courses on a flexible schedule support students outside a traditional campus programme.
      - Recommended ways to give students planning a PhD more research opportunities.
  - title: Publication
    paragraphs:
      - >-
        Exploring Transitions of Graduates From an Online Master's in
        Computer Science Program to Doctoral Programs. Published in the
        proceedings of the 57th ACM Technical Symposium on Computer
        Science Education, 2026.
