title: Recommending products to grow sales
shortTitle: Product recommendations
category: Data engineering
year: "2025"
period: "2025"
context: Commercial project
role: Data warehouse and recommendation workflow
featured: true
order: 1
summary: >-
  The goal was to grow sales through relevant product recommendations, while
  helping customers find what they needed. I built a customer data warehouse
  and recommendation workflow that combined purchase history, browsing activity,
  and estimated repeat purchase timing.
outcome: >-
  Marketing received product lists based on purchase history, browsing activity,
  and estimated repeat purchase timing. Duplicate products were removed and the
  remaining recommendations ranked again before campaign review.
stack: [SQL, PySpark, Batch processing, Recommendation ranking, Repeat purchase analysis, Deduplication]
sections:
  - title: Find opportunities for repeat purchases
    paragraphs:
      - >-
        I studied repeat purchases at the category level, grouping related
        products for the analysis.
      - >-
        These patterns gave a rough estimate of the time between purchases
        in each category. I compared that estimate with each customer's
        purchase history to find categories they might need again soon.
  - title: Rank products by relevance and timing
    paragraphs:
      - >-
        Recent purchases and the order of browsing activity helped identify
        relevant categories. I combined those signals with estimated repeat
        purchase timing to rank product recommendations.
      - >-
        Ranking ran in two passes. A quick first pass narrowed the candidate
        list. A more detailed second pass ordered the remaining recommendations
        for each customer token. This focused the detailed ranking work on
        a smaller set of candidates.
      - >-
        I checked each customer's recommendation list for repeated products,
        removed the duplicates, and ranked the remaining products again.
  - title: Build the purchase history behind the ranking
    paragraphs:
      - >-
        The ranking relied on a combined view of past purchases. I linked
        purchase records from different payment cards to a customer
        token, so recommendations could draw on that customer's purchase history.
        Recommendations were calculated for each token.
      - >-
        The workflow also removed duplicate transaction records.
  - title: Why SQL and PySpark fit this work
    paragraphs:
      - >-
        Team familiarity was a key reason for choosing SQL and PySpark.
        Data volume, runtime, and compute cost also shaped the decision.
        I used SQL for data preparation and PySpark for model building
        and batch runs.
      - >-
        SQL is a good fit for joins, filters, and grouped summaries.
        PySpark provides Python tools for model work and can spread batch
        calculations across machines. Grouping and sorting can also move
        data between workers, which adds time and resource costs.
      - >-
        Within Spark, SQL queries and DataFrame operations share an execution
        engine. Using Python in place of SQL does not itself make a job faster.
        The workload and how it runs matter more than the choice of syntax.
    comparison:
      caption: Options for the batch workflow
      rows:
        - option: SQL and PySpark
          benefit: >-
            Familiar tools for data preparation, Python model work, and
            distributed batch processing.
          tradeoff: >-
            Running work across machines adds overhead. Joins and sorts can
            move data between workers, so runtime and cost still need attention.
        - option: More work in SQL
          benefit: >-
            Joins, category summaries, purchase gaps, and scores based on
            rules can stay in the database.
          tradeoff: >-
            The fit depends on the platform's modelling tools and how easy
            the full workflow is to maintain in SQL.
        - option: pandas on one machine
          benefit: >-
            A simpler setup for exploration and jobs that fit comfortably
            in one machine's memory.
          tradeoff: >-
            Some operations copy the data and use more memory. Reading data in
            chunks helps when the calculation can be split into separate parts.
  - title: Match batch runs to campaign review
    paragraphs:
      - >-
        Marketing reviewed the product lists before campaign deployment,
        so batch runs fit the handoff. Live recommendations would be more useful
        if suggestions needed to change while a customer was browsing.
  - title: Make the workflow easy to review
    paragraphs:
      - >-
        During development, I started with rules that captured known business
        logic. This gave the team a clear way to check the first version,
        provide feedback, and refine the logic.
      - >-
        A ranking model can learn patterns that fixed rules miss. It needs
        suitable training data and a way to measure recommendation quality.
  - title: About this case study
    paragraphs:
      - >-
        This case study describes the technical approach. Company names,
        customer data, internal identifiers, and business figures
        are omitted.
