title: Exploring Transitions of Graduates From an Online Master's in Computer Science Program to Doctoral Programs
shortTitle: From an online master's to a PhD
year: "2026"
venue: SIGCSE 2026
authors:
  - Patrick Deng
  - Alexander D. Greenhalgh
  - Brian Yu
  - Nicholas Lytle
  - David A. Joyner
description: >-
  We studied how Georgia Tech's online computer science master's degree
  prepares graduates for a PhD. The study uses enrolment data, surveys,
  and interviews with OMSCS alumni.
