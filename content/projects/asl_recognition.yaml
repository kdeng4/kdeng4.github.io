title: ASL Recognition with Hidden Markov Models
shortTitle: Recognising sign language from video
category: Machine learning
year: "2024"
period: January to May 2024
context: Artificial Intelligence (CS 6601), Georgia Tech
role: Hand position features and sequence models
featured: true
order: 3
summary: >-
  I built a system that recognises American Sign Language gestures from video.
  It uses hand position features and Hidden Markov Models to follow
  how each sign moves over time.
outcome: A working system for recognising sign language gestures from video.
stack: [Python, Hidden Markov Models, NumPy]
sections:
  - title: The task
    paragraphs:
      - >-
        A sign depends on movement as well as hand position. To recognise
        American Sign Language from video, the model needs to follow
        how the hands move over time.
  - title: What I built
    paragraphs:
      - >-
        I trained Hidden Markov Models on a labelled set of ASL signs.
        These models use probabilities to describe how hand positions
        change during a gesture.
    bullets:
      - Extracted hand position features from video sequences.
      - Trained Hidden Markov Models with hmmlearn and NumPy.
      - Modelled how hand positions change over the course of a gesture.
  - title: The result
    paragraphs:
      - >-
        The system recognised gestures across a vocabulary of ASL signs.
        It combined hand position features with models of how each sign
        moves over time.
