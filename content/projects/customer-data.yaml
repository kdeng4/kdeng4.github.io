title: Recommending products to grow sales
shortTitle: Product recommendations
category: Data engineering
year: "2025"
period: "2025"
context: Commercial project
role: Data warehouse and recommendation workflow
featured: true
order: 1
summary: >-
  I built a customer data warehouse and recommendation workflow to support
  sales growth. It combined purchase history, browsing activity and estimated
  repeat purchase timing to suggest products customers might need next.
outcome: >-
  The workflow produced a ranked product list for each customer.
  Marketing reviewed the recommendations before campaign deployment.
stack: [SQL, PySpark, Batch processing, Recommendation ranking, Repeat purchase analysis, Deduplication]
sections:
  - title: A workflow for sales campaigns
    paragraphs:
      - >-
        The task was to choose products that matched a customer's interests
        and what they might need again soon. The workflow brought purchase
        records together, estimated repeat purchase timing, then ranked
        products, removed repeats and ranked the remaining products again.
        The final lists went to marketing for review.
      - >-
        I started development with rules for known business logic, so the team
        could check the first version and give feedback quickly. A trained
        ranking model can learn patterns that fixed rules miss, but needs
        suitable training data and a way to measure recommendation quality.
  - title: Build a usable purchase history
    paragraphs:
      - >-
        The ranking needed a combined view of past purchases. I linked purchase
        records from different payment cards to a customer token, so the
        recommendations could draw on that customer's purchase history.
        Recommendations were calculated for each token.
      - >-
        I used SQL to prepare the data for analysis. The workflow also removed
        duplicate transaction records, so repeated records would not be treated
        as separate purchases.
  - title: Estimate when customers may buy again
    paragraphs:
      - >-
        I studied repeat purchases at the category level, grouping related
        products to estimate the time between purchases in each category.
      - >-
        I compared these rough estimates with each customer's purchase history
        to find categories they might need again soon. Recent purchases and
        the order of browsing activity helped identify which categories were
        most relevant.
  - title: Rank products and remove repeats
    paragraphs:
      - >-
        I combined purchase history, recent browsing activity and estimated
        repeat purchase timing to rank product recommendations for each customer.
      - >-
        Ranking ran in two passes. A quick first pass narrowed the candidate
        list. A more detailed second pass ordered the remaining recommendations.
        This focused the detailed ranking work on a smaller set of candidates.
      - >-
        I checked each customer's recommendation list for repeated products,
        removed the duplicates, and ranked the remaining products again.
  - title: Why SQL and PySpark fit the work
    paragraphs:
      - >-
        The team already knew SQL and PySpark. Batch size, runtime and compute
        cost also shaped the choice. SQL handled data preparation, while
        I used PySpark for model building and batch runs.
      - >-
        Within Spark, SQL queries and DataFrame operations share an execution
        engine. Using Python in place of SQL does not itself make a job faster.
        The workload and how it runs matter more than the choice of syntax.
    comparison:
      caption: Options for the batch workflow
      rows:
        - option: SQL and PySpark
          benefit: >-
            SQL for joins, filters and grouped summaries, with familiar Python
            tools for model work and batch calculations across machines.
          tradeoff: >-
            Running work across machines adds overhead. Joins, grouping and
            sorts can move data between workers, so runtime and cost still
            need attention.
        - option: More work in SQL
          benefit: >-
            Joins, category summaries, purchase gaps, and scores based on
            rules can stay in the database.
          tradeoff: >-
            The fit depends on the platform's modelling tools and how easy
            the full workflow is to maintain in SQL.
        - option: pandas on one machine
          benefit: >-
            A simpler setup for exploration and jobs that fit comfortably
            in one machine's memory.
          tradeoff: >-
            Some operations copy the data and use more memory. Reading data in
            chunks helps when the calculation can be split into separate parts.
  - title: Why I used batch runs
    paragraphs:
      - >-
        These recommendations supported campaigns with a marketing review
        step. Batch runs fit that process by producing lists for the team
        to review before deployment. Live recommendations would be more useful
        if suggestions needed to change during a customer's browsing session.
  - title: About this case study
    paragraphs:
      - >-
        This case study describes the technical approach. Company names,
        customer data, internal identifiers, and business figures
        are omitted.
