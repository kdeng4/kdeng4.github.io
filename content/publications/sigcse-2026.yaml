title: Exploring Transitions of Graduates From an Online Master's in Computer Science Program to Doctoral Programs
shortTitle: From an online master's to doctoral research
year: "2026"
venue: SIGCSE 2026
authors:
  - Patrick Deng
  - Alexander D. Greenhalgh
  - Brian Yu
  - Nicholas Lytle
  - David A. Joyner
description: >-
  How does an online computer science degree prepare graduates for a PhD?
  Our study draws on enrolment data, surveys, and interviews with Georgia
  Tech OMSCS alumni to explore their paths into doctoral research.
