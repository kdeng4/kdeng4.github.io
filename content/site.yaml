    introduction: AI Automation Lead II at Instacart. Based in Toronto.
    paragraphs:
      - >-
        At Instacart, I work on AI automation in Commercial Strategy & Acceleration.
      - >-
        Before Instacart, I worked on data pipelines and machine learning at
        Walmart Canada. I owned a BigQuery data warehouse that handled over
        70 million records a day. It supported customer analysis and marketing
        decisions.
      - >-
        I earned a master's in chemical engineering at the University of
        Calgary in 2020. I completed a master's in computer science at Georgia
        Tech in 2025. My work has included grouping customers, recommending
        products, and using AI to check data quality.
      - >-
        Outside work, I hike with my dog, Roxy, ski, read, and listen to music.
        I'm fluent in English and Mandarin Chinese.
