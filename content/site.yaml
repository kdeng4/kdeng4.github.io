  about:
    eyebrow: A little background
    title: Hi, I'm Patrick.
    introduction: Data engineer. Applied AI practitioner. Always curious.
    paragraphs:
      - >-
        I build production data pipelines and applied ML systems at Walmart
        Canada. I own the end-to-end Ads CRM data warehouse on GCP BigQuery,
        processing more than 70 million records daily to support customer
        targeting, segmentation, and marketing decisions.
      - >-
        My background connects engineering fundamentals with practical data
        work. I hold an M.Sc. in Computer Science from Georgia Tech (2025)
        and an M.Eng. in Chemical Engineering from the University of Calgary
        (2020). My work has included customer segmentation, recommendation
        systems, and GenAI tools for data quality.
      - >-
        Outside work, I enjoy hiking with my dog, Roxy, skiing, reading,
        and music. I'm fluent in English and Mandarin Chinese.
