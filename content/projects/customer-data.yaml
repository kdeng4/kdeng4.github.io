title: Helping customers find what they need next
shortTitle: Customer recommendations
category: Data engineering
context: Commercial project
role: Data warehouse and recommendation workflow
featured: true
order: 1
summary: >-
  I built a customer data warehouse and recommendation workflow for marketing.
  It used purchase history, browsing activity, and repeat buying patterns
  to rank what each customer might need next.
outcome: >-
  The workflow turned purchase and browsing history into ranked product recommendations,
  with duplicate entries removed before marketing review and campaign launch.
stack: [SQL, PySpark, Batch processing, Recommendation ranking, Repeat purchase analysis, Deduplication]
sections:
  - title: The recommendation problem
    paragraphs:
      - >-
        The task was to decide which products to recommend and when.
        I built a workflow for customer relationship management, or CRM,
        that combined what a customer had bought, what they were browsing,
        and when they might need to buy from a category again.
  - title: Start with clear rules
    paragraphs:
      - >-
        I started with rules that captured known business logic. This gave the
        first version predictable results and made it quick to review.
        The team could check the output, give feedback, and refine the logic
        in short cycles.
  - title: Connect purchases through customer tokens
    paragraphs:
      - >-
        I linked purchase records from different payment cards to an encrypted
        customer token. That token tied the records together so the workflow
        could use a combined purchase history. Recommendations were calculated
        for each customer token.
  - title: Prepare in SQL, process in PySpark
    paragraphs:
      - >-
        SQL handled the initial data preparation, including removing duplicate
        transaction records. I then used PySpark for model building and batch
        runs, so the heavier calculations could run in parallel across the data.
  - title: Estimate when a category is needed again
    paragraphs:
      - >-
        I studied repeat purchases across groups of related products.
        A customer can switch between items that serve the same need, so
        the analysis worked at the category level.
      - >-
        These patterns gave a rough estimate of the time between purchases
        in each category. I compared that estimate with each customer's
        purchase history to find categories they might need again soon.
  - title: Combine interest and timing, then rank
    paragraphs:
      - >-
        Recent purchases and the order of browsing activity helped identify
        relevant categories. I combined those signals with estimated repeat
        purchase timing to rank product recommendations.
      - >-
        Ranking ran in two passes. A quick first pass narrowed the candidate
        list. A more detailed second pass ordered the remaining recommendations
        for each customer token. This focused the detailed ranking work on
        a smaller set of candidates.
  - title: Remove repeats before campaign review
    paragraphs:
      - >-
        I checked each customer's recommendation list for repeated products,
        removed the duplicates, and ranked the remaining products again.
      - >-
        The recommendations then went to marketing for review before the
        campaign was deployed.
  - title: About this case study
    paragraphs:
      - >-
        This case study describes the technical approach. Company names,
        dates, customer data, internal identifiers, and business figures
        are omitted.
